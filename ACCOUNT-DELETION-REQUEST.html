<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request Account Deletion | Weekly Tax App</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --border: #e5e7eb;
        --error: #dc2626;
        --success: #059669;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #f7f8fb 0%, #eef7f6 100%);
      }
      main {
        max-width: 600px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      }
      h1 { margin: 0 0 8px 0; font-size: 1.75rem; }
      p { line-height: 1.6; }
      .muted { color: var(--muted); }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.95rem;
      }
      input[type="email"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      input[type="checkbox"] {
        margin-right: 8px;
      }
      .checkbox-label {
        display: flex;
        align-items: flex-start;
        font-weight: normal;
        margin-top: 16px;
      }
      .checkbox-label input {
        margin-top: 4px;
        margin-right: 8px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        width: 100%;
        margin-top: 16px;
      }
      button:hover { opacity: 0.9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .message {
        padding: 12px 14px;
        border-radius: 8px;
        margin-top: 16px;
        display: none;
      }
      .message.error {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: var(--error);
        display: block;
      }
      .message.success {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: var(--success);
        display: block;
      }
      .notice {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        color: #9a3412;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Request Account Deletion</h1>
        <p class="muted">Last updated: 25 August 2026</p>

        <p>Submit this form to request permanent deletion of your Weekly Tax App account and all associated data.</p>

        <form id="deletionForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Additional Message (optional)</label>
            <textarea
              id="message"
              name="message"
              placeholder="Any additional details about your deletion request..."
            ></textarea>
          </div>

          <label class="checkbox-label">
            <input
              type="checkbox"
              id="confirmation"
              name="confirmation"
              required
            />
            I request permanent deletion of my Weekly Tax App account and associated data.
          </label>

          <button type="submit" id="submitBtn">Submit Deletion Request</button>

          <div id="message" class="message"></div>
        </form>

        <div class="notice">
          After submitting this form, our team will verify your identity and process your deletion request within 30 days.
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('deletionForm');
      const messageDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const fullName = document.getElementById('fullName').value;
        const message = document.getElementById('message').value;

        submitBtn.disabled = true;
        messageDiv.className = 'message';
        messageDiv.textContent = '';

        try {
          const response = await fetch('/auth/account-deletion-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, fullName, message })
          });

          const data = await response.json();

          if (response.ok) {
            messageDiv.className = 'message success';
            messageDiv.textContent = 'Deletion request submitted successfully. We will process your request within 30 days.';
            form.reset();
          } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = data.error || 'Failed to submit request. Please try again.';
          }
        } catch (error) {
          messageDiv.className = 'message error';
          messageDiv.textContent = 'Network error. Please try again or email support@aplccommodities.com directly.';
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
